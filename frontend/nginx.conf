server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: serve index.html for any non-asset path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy to the backend service. The backend's routes are
    # served at the root, so we strip the /api prefix.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Long-term caching for fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No server-info leaks.
    server_tokens off;
}